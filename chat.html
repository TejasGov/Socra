<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Project — Chat</title>
<link rel="stylesheet" href="css/style.css">
<style>
.chat-layout { display: grid; grid-template-columns: 260px 1fr 280px; gap: 1rem; align-items: start; }

/* LEFT SIDEBAR */
.left-panel { display: flex; flex-direction: column; gap: 10px; position: sticky; top: calc(var(--nav-h) + 1rem); }
.panel-card { background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius-lg); overflow: hidden; }
.panel-header { padding: 12px 14px; border-bottom: 0.5px solid var(--border); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); }
.user-list { padding: 8px 0; }
.user-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px; cursor: pointer; transition: background 0.12s; }
.user-row:hover { background: var(--surface2); }
.user-row.active-user { background: var(--accent-light); }
.user-av { width: 32px; height: 32px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.user-name { font-size: 13px; font-weight: 500; }
.user-role { font-size: 11px; color: var(--text-3); }
.you-badge { font-size: 10px; background: var(--accent-light); color: var(--accent); padding: 1px 6px; border-radius: 10px; margin-left: 4px; font-weight: 600; }
.online-dot { width: 8px; height: 8px; border-radius: 50%; background: #3B6D11; margin-left: auto; flex-shrink: 0; }

.channel-list { padding: 8px 0; }
.channel-row { display: flex; align-items: center; gap: 8px; padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--text-2); transition: background 0.12s; border-radius: 0; }
.channel-row:hover { background: var(--surface2); }
.channel-row.active { background: var(--surface2); color: var(--text); font-weight: 500; }
.channel-hash { color: var(--text-3); font-size: 16px; line-height: 1; }
.unread-badge { margin-left: auto; background: var(--red); color: #fff; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 10px; }

/* MAIN CHAT */
.chat-main { background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius-lg); display: flex; flex-direction: column; min-height: 70vh; }
.chat-header { padding: 14px 18px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 10px; }
.chat-header-title { font-weight: 500; font-size: 15px; }
.chat-header-sub { font-size: 12px; color: var(--text-3); }
.messages-area { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; min-height: 400px; max-height: 520px; }
.msg-group { display: flex; gap: 10px; }
.msg-av { width: 32px; height: 32px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.msg-content { flex: 1; }
.msg-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.msg-author { font-size: 13px; font-weight: 600; }
.msg-time { font-size: 11px; color: var(--text-3); }
.msg-text { font-size: 14px; color: var(--text); line-height: 1.55; }
.msg-text.system { color: var(--text-3); font-style: italic; font-size: 13px; }
.msg-date-pin { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-light); color: var(--accent); font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 4px; margin-top: 4px; }
.chat-input-bar { padding: 12px 16px; border-top: 0.5px solid var(--border); display: flex; gap: 8px; align-items: flex-end; }
.chat-input-bar textarea { min-height: 40px; max-height: 120px; font-size: 14px; border-radius: var(--radius-md); }
.date-tag-row { padding: 6px 16px 0; display: flex; align-items: center; gap: 6px; }
.pinned-date-tag { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-light); color: var(--accent); font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 20px; }
.clear-pin { background: none; border: none; cursor: pointer; color: var(--accent); font-size: 14px; line-height: 1; padding: 0 2px; }
.day-divider { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
.day-divider span { font-size: 11px; color: var(--text-3); white-space: nowrap; }
.day-divider::before, .day-divider::after { content:''; flex:1; height:0.5px; background: var(--border); }

/* RIGHT SIDEBAR */
.right-panel { display: flex; flex-direction: column; gap: 10px; position: sticky; top: calc(var(--nav-h) + 1rem); }
.pinned-list { padding: 8px 0; max-height: 320px; overflow-y: auto; }
.pinned-item { padding: 10px 14px; border-bottom: 0.5px solid var(--border); cursor: pointer; transition: background 0.12s; }
.pinned-item:hover { background: var(--surface2); }
.pinned-item:last-child { border-bottom: none; }
.pinned-date { font-size: 12px; font-weight: 600; color: var(--text); }
.pinned-phase { font-size: 11px; margin-top: 1px; }
.pinned-preview { font-size: 12px; color: var(--text-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pinned-count { font-size: 11px; color: var(--text-3); }
.permissions-list { padding: 8px 0; }
.perm-row { display: flex; align-items: center; gap: 8px; padding: 8px 14px; }
.perm-av-sm { width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.perm-name { font-size: 12px; font-weight: 500; flex: 1; }
.perm-toggle { position: relative; width: 34px; height: 18px; cursor: pointer; }
.perm-toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.perm-slider { position: absolute; inset: 0; border-radius: 9px; background: var(--surface2); border: 0.5px solid var(--border-strong); transition: background 0.2s; }
.perm-slider::after { content:''; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--text-3); top: 2px; left: 2px; transition: transform 0.2s, background 0.2s; }
.perm-toggle input:checked + .perm-slider { background: var(--accent); border-color: var(--accent); }
.perm-toggle input:checked + .perm-slider::after { transform: translateX(16px); background: #fff; }
.owner-badge { font-size: 10px; color: var(--accent); font-weight: 600; }

@media (max-width: 900px) { .chat-layout { grid-template-columns: 1fr; } .left-panel, .right-panel { position: static; } }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">Research <span>Project</span></a>
  <div class="nav-links">
    <a href="index.html" data-page="overview">Overview</a>
    <a href="calendar.html" data-page="calendar">Calendar</a>
    <a href="gantt.html" data-page="gantt">Timeline</a>
    <a href="chat.html" data-page="chat">Chat</a>
  </div>
  <div class="nav-user">
    <span id="nav-name"></span>
    <div class="avatar" id="nav-avatar" onclick="logout()" title="Logout">YO</div>
  </div>
</nav>

<div class="page" style="padding-top:1.5rem">
  <div style="margin-bottom:1rem">
    <div class="mono" style="font-size:11px;color:var(--accent);letter-spacing:0.08em;margin-bottom:4px">TEAM COLLABORATION</div>
    <h1 class="serif" style="font-size:28px">Chat & comments</h1>
  </div>

  <div class="chat-layout">

    <!-- LEFT -->
    <div class="left-panel">
      <div class="panel-card">
        <div class="panel-header">Channels</div>
        <div class="channel-list">
          <div class="channel-row active" data-channel="general" onclick="switchChannel('general',this)">
            <span class="channel-hash">#</span> general
          </div>
          <div class="channel-row" data-channel="research" onclick="switchChannel('research',this)">
            <span class="channel-hash">#</span> research
          </div>
          <div class="channel-row" data-channel="dev" onclick="switchChannel('dev',this)">
            <span class="channel-hash">#</span> development
          </div>
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-header">Members</div>
        <div class="user-list" id="user-list"></div>
      </div>
    </div>

    <!-- MAIN -->
    <div class="chat-main">
      <div class="chat-header">
        <div>
          <div class="chat-header-title" id="chat-title"># general</div>
          <div class="chat-header-sub">Team discussion — 3 members</div>
        </div>
      </div>

      <div class="messages-area" id="messages-area"></div>

      <div class="date-tag-row" id="date-tag-row" style="display:none">
        <div class="pinned-date-tag">
          📅 Pinned to: <span id="pinned-date-label"></span>
          <button class="clear-pin" onclick="clearPin()">×</button>
        </div>
      </div>

      <div class="chat-input-bar">
        <textarea id="msg-input" placeholder="Message #general…" rows="1"></textarea>
        <button class="btn btn-primary" onclick="sendMessage()" style="height:40px;flex-shrink:0">Send</button>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right-panel">
      <div class="panel-card">
        <div class="panel-header">Pinned date comments</div>
        <div class="pinned-list" id="pinned-list"></div>
      </div>

      <div class="panel-card" id="permissions-card">
        <div class="panel-header">Permissions</div>
        <div style="padding:10px 14px 4px;font-size:12px;color:var(--text-2);line-height:1.5">Control who can post comments</div>
        <div class="permissions-list" id="permissions-list"></div>
      </div>
    </div>

  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script>
markActive('chat');
updateNavUser();

let currentChannel = 'general';
let pinnedDate = null;

function buildUserList() {
  const el = document.getElementById('user-list');
  el.innerHTML = '';
  const cur = currentUser();
  Object.entries(USERS).forEach(([uid, u]) => {
    const row = document.createElement('div');
    row.className = 'user-row' + (uid === cur ? ' active-user' : '');
    
    const av = document.createElement('div');
    av.className = 'user-av';
    av.style.background = u.color;
    av.textContent = u.initials;
    
    const info = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'user-name';
    name.textContent = u.name.replace(' (Owner)','');
    if (uid === cur) {
      const badge = document.createElement('span');
      badge.className = 'you-badge';
      badge.textContent = 'you';
      name.appendChild(badge);
    }
    
    const role = document.createElement('div');
    role.className = 'user-role';
    role.textContent = uid === 'owner' ? 'Project lead' : 'Collaborator';
    
    info.appendChild(name);
    info.appendChild(role);
    
    row.appendChild(av);
    row.appendChild(info);
    
    const dot = document.createElement('div');
    dot.className = 'online-dot';
    row.appendChild(dot);
    
    el.appendChild(row);
  });
}
function renderUserList() { buildUserList(); }
buildUserList();

function renderPermissions() {
  const perms = loadData('chatPerms', {});
  const el = document.getElementById('permissions-list');
  el.innerHTML = '';
  const cur = currentUser();

  Object.entries(USERS).forEach(([uid, u]) => {
    if (uid === 'owner') {
      const row = document.createElement('div');
      row.className = 'perm-row';
      row.innerHTML = `<div class="perm-av-sm" style="background:${u.color}">${u.initials}</div><div class="perm-name">${u.name}</div><span class="owner-badge">Owner</span>`;
      el.appendChild(row);
      return;
    }
    const allowed = perms[uid] !== false;
    const row = document.createElement('div');
    row.className = 'perm-row';
    const disabled = cur !== 'owner';
    
    const av = document.createElement('div');
    av.className = 'perm-av-sm';
    av.style.background = u.color;
    av.textContent = u.initials;
    
    const name = document.createElement('div');
    name.className = 'perm-name';
    name.textContent = u.name;
    
    const label = document.createElement('label');
    label.className = 'perm-toggle';
    if (disabled) label.style.cssText = 'opacity:.5;cursor:not-allowed';
    
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = allowed;
    input.disabled = disabled;
    input.onchange = (e) => togglePerm(uid, e.target.checked);
    
    const slider = document.createElement('span');
    slider.className = 'perm-slider';
    
    label.appendChild(input);
    label.appendChild(slider);
    
    row.appendChild(av);
    row.appendChild(name);
    row.appendChild(label);
    el.appendChild(row);
  });

  if (cur !== 'owner') {
    const note = document.createElement('div');
    note.style.cssText = 'padding:6px 14px 10px;font-size:11px;color:var(--text-3)';
    note.textContent = 'Only the owner can manage permissions.';
    el.appendChild(note);
  }
}
renderPermissions();

async function togglePerm(uid, val) {
  if (currentUser() !== 'owner') return;
  const perms = loadData('chatPerms', {});
  perms[uid] = val;
  await dbUpdatePerms({ [uid]: val });
}

function canPost() {
  const cur = currentUser();
  if (cur === 'owner') return true;
  const perms = loadData('chatPerms', {});
  return perms[cur] !== false;
}

function switchChannel(ch, el) {
  currentChannel = ch;
  document.querySelectorAll('.channel-row').forEach(r => r.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('chat-title').textContent = '# ' + ch;
  document.getElementById('msg-input').placeholder = `Message #${ch}…`;
  renderMessages();
}

function renderMessages() {
  const area = document.getElementById('messages-area');
  const msgs = loadData('chatMsgs_' + currentChannel, []);
  area.innerHTML = '';

  if (!msgs.length) {
    area.innerHTML = `<div style="text-align:center;color:var(--text-3);font-size:13px;padding:2rem 0">No messages yet. Start the conversation!</div>`;
    return;
  }

  let lastDay = '';
  msgs.forEach(m => {
    const day = m.date || 'Today';
    if (day !== lastDay) {
      const div = document.createElement('div');
      div.className = 'day-divider';
      div.innerHTML = `<span>${day}</span>`;
      area.appendChild(div);
      lastDay = day;
    }
    
    // Fallback if uid is not in our mock USERS map (e.g. real Supabase ID)
    const u = USERS[m.uid] || USERS['tejas'];
    
    const group = document.createElement('div');
    group.className = 'msg-group';
    
    const av = document.createElement('div');
    av.className = 'msg-av';
    av.style.background = u.color;
    av.textContent = u.initials;
    
    const content = document.createElement('div');
    content.className = 'msg-content';
    
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    
    const author = document.createElement('span');
    author.className = 'msg-author';
    author.textContent = u.name;
    
    const time = document.createElement('span');
    time.className = 'msg-time';
    time.textContent = m.time;
    
    meta.appendChild(author);
    meta.appendChild(time);
    
    const text = document.createElement('div');
    text.className = 'msg-text';
    text.textContent = m.text; // SECURE: Uses textContent to prevent XSS
    
    content.appendChild(meta);
    content.appendChild(text);
    
    if (m.pinned_date) {
      const phase = getPhase(new Date(m.pinned_date));
      const pin = document.createElement('div');
      pin.className = 'msg-date-pin';
      pin.textContent = `📅 ${m.pinned_date_label}${phase ? ' · ' + phase.label : ''}`;
      content.appendChild(pin);
    }
    
    group.appendChild(av);
    group.appendChild(content);
    area.appendChild(group);
  });
  area.scrollTop = area.scrollHeight;
}

async function sendMessage() {
  if (!canPost()) {
    alert('You don\'t have permission to post in this channel. Ask the project owner.');
    return;
  }
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  const msg = {
    text,
    time: fmtTime(),
    date: new Date().toLocaleDateString('en-US', {month:'long',day:'numeric',year:'numeric'})
  };
  if (pinnedDate) {
    msg.pinnedDate = pinnedDate;
    msg.pinnedDateLabel = document.getElementById('pinned-date-label').textContent;
  }
  
  await dbSendMessage(currentChannel, msg);
  
  input.value = '';
  clearPin();
}

function clearPin() {
  pinnedDate = null;
  document.getElementById('date-tag-row').style.display = 'none';
}

function pinDate(dateStr, label) {
  pinnedDate = dateStr;
  document.getElementById('pinned-date-label').textContent = label;
  document.getElementById('date-tag-row').style.display = 'flex';
  document.getElementById('msg-input').focus();
}

function renderPinnedDates() {
  const allComments = loadData('dayComments', {});
  const allMsgs = ['general','research','dev'].flatMap(ch => {
    return (loadData('chatMsgs_' + ch, [])).filter(m => m.pinned_date);
  });

  const dateMap = {};
  allMsgs.forEach(m => {
    if (!dateMap[m.pinned_date]) dateMap[m.pinned_date] = { label: m.pinned_date_label, msgs: [] };
    dateMap[m.pinned_date].msgs.push(m);
  });
  Object.entries(allComments).forEach(([k, v]) => {
    if (v.length && !dateMap[k]) {
      const d = new Date(k);
      dateMap[k] = { label: fmtShort(d), msgs: v };
    } else if (v.length && dateMap[k]) {
      dateMap[k].msgs = dateMap[k].msgs.concat(v);
    }
  });

  const list = document.getElementById('pinned-list');
  const entries = Object.entries(dateMap).sort((a,b) => a[0].localeCompare(b[0]));

  if (!entries.length) {
    list.innerHTML = '<div style="padding:12px 14px;font-size:12px;color:var(--text-3)">No date-pinned comments yet. Pin a message to a date from the chat input.</div>';
    return;
  }
  list.innerHTML = '';
  entries.forEach(([dateStr, info]) => {
    const d = new Date(dateStr);
    const phase = getPhase(d);
    const preview = info.msgs[info.msgs.length-1];
    const previewU = preview ? (USERS[preview.uid] || USERS['tejas']) : null;
    
    const item = document.createElement('div');
    item.className = 'pinned-item';
    
    const dateEl = document.createElement('div');
    dateEl.className = 'pinned-date';
    dateEl.textContent = info.label || fmtShort(d);
    
    item.appendChild(dateEl);
    
    if (phase) {
      const phaseEl = document.createElement('div');
      phaseEl.className = 'pinned-phase';
      phaseEl.style.color = phase.text;
      phaseEl.textContent = phase.label;
      item.appendChild(phaseEl);
    }
    
    const previewEl = document.createElement('div');
    previewEl.className = 'pinned-preview';
    previewEl.textContent = (previewU ? previewU.name.replace(' (Owner)','') + ': ' : '') + (preview ? preview.text : '');
    item.appendChild(previewEl);
    
    const countEl = document.createElement('div');
    countEl.className = 'pinned-count';
    countEl.textContent = `${info.msgs.length} comment${info.msgs.length>1?'s':''}`;
    item.appendChild(countEl);
    
    item.addEventListener('click', () => pinDate(dateStr, info.label || fmtShort(d)));
    list.appendChild(item);
  });
}

document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('msg-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

const params = new URLSearchParams(location.search);
if (params.get('pinDate')) {
  const d = new Date(params.get('pinDate'));
  pinDate(params.get('pinDate'), fmtShort(d));
}

renderMessages();
renderPinnedDates();
</script>
</body>
</html>
