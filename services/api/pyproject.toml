[project]
name = "socra-api"
version = "0.1.0"
description = "Socra Socratic tutoring backend (FastAPI)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern relies on calling Depends(...) in
# argument defaults; this is safe (Depends is a marker, not mutable state).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Body", "fastapi.Query"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
